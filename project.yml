# XcodeGen spec. The .xcodeproj is generated from this file (`make project`); edit this, not the project.
name: TheShortsEditor
options:
  bundleIdPrefix: com.lucalevi
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  EditorCore:
    path: Packages/EditorCore
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  TheShortsEditor:
    type: application
    platform: macOS
    sources:
      - App
    dependencies:
      - package: EditorCore
        product: EditorCore
      - package: EditorCore
        product: RenderEngine
      - package: EditorCore
        product: Transcription
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Shorts Editor
        CFBundleName: Shorts Editor
        LSApplicationCategoryType: public.app-category.video
        NSSpeechRecognitionUsageDescription: Captions are made on this Mac from what is said in your clips.
        NSHumanReadableCopyright: "© 2026 Luca Iacolettig"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Lets videos be opened with the app from Finder ("Open With", or dropped on the Dock icon).
        # Alternate rank: never takes over as the default player for movies.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Shorts Editor Project
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes: [com.lucalevi.shortseditor.project]
          - CFBundleTypeName: Video
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.movie]
          - CFBundleTypeName: Sound
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.audio]
          - CFBundleTypeName: Picture
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.image]
        # Saved Shorts: a JSON file with its own extension, opened by this app.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.lucalevi.shortseditor.project
            UTTypeDescription: Shorts Editor Project
            UTTypeConformsTo: [public.json, public.content]
            UTTypeTagSpecification:
              public.filename-extension: [shortsproject]
    entitlements:
      path: App/TheShortsEditor.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        # Bookmarks let a saved Short find its media (and recent projects) again after a restart.
        com.apple.security.files.bookmarks.app-scope: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lucalevi.TheShortsEditor
        PRODUCT_NAME: Shorts Editor
        # Signed locally ("Sign to Run Locally") until there is a Developer ID for the .dmg.
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_UPCOMING_FEATURE_NONISOLATED_NONSENDING_BY_DEFAULT: YES
